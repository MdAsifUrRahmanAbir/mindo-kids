name: mindo_kids
description: "Mindo Kids — multilingual brain-boost learning app for children. All content is served from Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + navigation (same stack as SalesysX)
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.2

  # Firebase — left unpinned so pub picks one compatible FlutterFire set
  firebase_core:
  firebase_auth:
  cloud_firestore:
  cloud_functions:

  # Subscriptions (Google Play Billing / StoreKit)
  in_app_purchase: ^3.2.0

  # Media + audio
  cached_network_image: ">=3.4.1 <5.0.0"
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

  # UI / utils
  # 9.x moved to the standalone material_ui package; this app uses flutter/material.
  google_fonts: ">=6.2.1 <9.0.0"
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
